{% extends "base.html" %}
{% block title %}Organizing Team Login{% endblock %}
{% block content %}
<div class="form-wrap">
  <div class="form-card">
    <h2>Organizing Team Login</h2>
    <p class="subtitle">Access the participants overview</p>
    <form method="POST">
      <label>Email</label>
      <input type="email" name="email" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit" class="btn btn-secondary btn-block" style="margin-top:24px;">Log In</button>
    </form>
    <div class="form-footer">
      New here? <a href="{{ url_for('org_register') }}">Create an account</a>
    </div>
  </div>
</div>
{% endblock %}
