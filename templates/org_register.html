{% extends "base.html" %}
{% block title %}Organizing Team Registration{% endblock %}
{% block content %}
<div class="form-wrap">
  <div class="form-card">
    <h2>Organizing Team Registration</h2>
    <p class="subtitle">For coordinators, staff &amp; volunteers</p>
    <form method="POST">
      <label>Full Name</label>
      <input type="text" name="name" required>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Phone Number</label>
      <input type="tel" name="phone" required pattern="[0-9]{10}">

      <label>Role (e.g. Staff Coordinator, Volunteer)</label>
      <input type="text" name="role" required>

      <label>Create Password</label>
      <input type="password" name="password" required minlength="6">

      <button type="submit" class="btn btn-secondary btn-block" style="margin-top:24px;">Submit Registration</button>
    </form>
    <div class="form-footer">
      Already registered? <a href="{{ url_for('org_login') }}">Log in here</a>
    </div>
  </div>
</div>
{% endblock %}
